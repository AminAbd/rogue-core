<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120C26">
<title>Rogue Core</title>
<meta name="description" content="A free secret-team party game for 3 to 8 players, each on their own phone.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column. Anime trading-card look: night-sky violet ground, glossy panels,
   illustrated role cards and cable cards. Deliberately a single dark look. */
:root {
  --bg: #120C26; --bg2: #1E1442; --panel: rgba(36,24,74,.78); --panel2: #2B1E5A; --line: rgba(255,255,255,.13);
  --fg: #F7F2FF; --muted: #B9ADDB; --pink: #FF5FA2; --cyan: #4FE3FF; --gold: #FFD166;
  --key: #5CF2B0; --dead: #8E9BB8; --core: #FF3D6E; --sys: #5AB6FF;
  --display: "Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { background: var(--bg) }
body { margin: 0; color: var(--fg); font: 500 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; min-height: 100vh;
  background:
    radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 72% 9%, #fff7 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 85% 42%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 33% 64%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 82%, #fff6 50%, transparent 51%), radial-gradient(1.5px 1.5px at 8% 90%, #fff5 50%, transparent 51%),
    radial-gradient(60% 40% at 0% 0%, rgba(255,95,162,.28), transparent 70%),
    radial-gradient(60% 45% at 100% 100%, rgba(79,227,255,.22), transparent 70%),
    linear-gradient(180deg, var(--bg2), var(--bg) 60%);
  background-attachment: fixed }
body.shake { animation: shake .45s linear }
@keyframes shake { 20% { transform: translate(-6px, 3px) } 40% { transform: translate(5px, -4px) } 60% { transform: translate(-4px, -2px) } 80% { transform: translate(3px, 3px) } }
.wrap { max-width: 560px; margin: 0 auto; padding-block: max(20px, env(safe-area-inset-top, 0px)) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance }
.logo { display: grid; gap: 2px }
.logo h1 { font-size: 2.3rem; letter-spacing: .02em; background: linear-gradient(180deg, #FFFFFF 10%, #FFC2E0 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #5A1E6E) drop-shadow(0 0 14px rgba(255,95,162,.45)) }
.logo h1 span { background: linear-gradient(180deg, #FFF 10%, #9FF1FF 55%, var(--cyan)); -webkit-background-clip: text; background-clip: text }
.logo small { font-size: .78rem; letter-spacing: .4em; color: var(--gold) }
h2 { font-size: 1.25rem }
p { margin: 0 }
.muted { color: var(--muted) }
.label { font: 800 0.68rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(6px) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
input { font: 700 1rem var(--body); color: var(--fg); background: rgba(10,6,24,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; min-width: 0 }
input:focus { outline: 2px solid var(--pink); outline-offset: 1px }
#code-in { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-family: var(--display) }
button { font: 800 0.95rem var(--body); color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; touch-action: manipulation; transition: transform .1s }
button:active { transform: scale(.97) }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
button.primary { background: linear-gradient(180deg, #FF8CC0, var(--pink)); border-color: #FFB3D6; color: #3A0620; box-shadow: 0 4px 0 #A3205E, 0 0 18px rgba(255,95,162,.35) }
button:disabled { opacity: .45; cursor: default }
.split { display: grid; grid-template-columns: 1fr auto; gap: 8px }
.bigcode { font: 400 2.8rem/1 var(--display); letter-spacing: .22em; color: var(--gold); text-shadow: 0 3px 0 #7A4A00, 0 0 18px rgba(255,209,102,.4) }
.notice { border-left: 3px solid var(--gold); padding: 8px 12px; background: rgba(255,209,102,.08); border-radius: 0 10px 10px 0; font-size: .92rem }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.players li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; background: rgba(255,255,255,.05); border-radius: 14px }
.players li.off { opacity: .5 }
.who-line { display: flex; align-items: center; gap: 10px; min-width: 0 }
.ava { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,.25); background: #2B1E5A; display: block }
.chip { font: 800 .7rem/1 var(--body); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: rgba(0,0,0,.2) }
.chip.gold { color: var(--gold); border-color: var(--gold) }
.chip.key { color: var(--key); border-color: var(--key) }
.chip.core { color: var(--core); border-color: var(--core) }
button.chip { padding: 5px 8px }
.share { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center }
.share code { font: 600 .78rem ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; text-align: left }

.status { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 4px }
.stat b { font: 400 1.3rem/1 var(--display); font-variant-numeric: tabular-nums }
.keys { display: flex; gap: 3px; flex-wrap: wrap }
.keys i { width: 11px; height: 11px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); background: rgba(255,255,255,.18) }
.keys i.on { background: var(--key); filter: drop-shadow(0 0 4px var(--key)) }
.turn { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; display: flex; gap: 10px; align-items: center }
.turn.mine { border-color: var(--gold); color: var(--gold); background: linear-gradient(90deg, rgba(255,209,102,.16), rgba(255,95,162,.1)); animation: pulse 1.4s ease-in-out infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,209,102,.14) } }
.event { font-weight: 700; color: var(--muted); text-align: center }
.event b { color: var(--fg) }

/* secret: the illustrated role card */
.peek { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; border-radius: 16px; cursor: pointer; touch-action: none; position: relative; overflow: hidden;
  display: grid; place-items: center; min-height: 150px; padding: 14px; text-align: center;
  background: repeating-linear-gradient(135deg, rgba(255,95,162,.12) 0 12px, rgba(79,227,255,.08) 12px 24px), #1A1238; border: 2px dashed rgba(255,255,255,.2) }
.peek.open { padding: 0; border: 0; background: none; min-height: 0 }
.rolecard { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; width: 100%; padding: 10px; border-radius: 16px; background: rgba(0,0,0,.25) }
.rolecard svg { width: 100%; height: auto; border-radius: 12px; display: block; box-shadow: 0 6px 20px rgba(0,0,0,.4) }
.rolecard .rn { font: 400 1.35rem var(--display) }
.rolecard.sys .rn { color: var(--sys) } .rolecard.rogue .rn { color: var(--core) }
.hand { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
.claims { display: flex; gap: 6px; flex-wrap: wrap }
.claims button { padding: 8px 12px; font-size: .85rem; border-radius: 999px }
.claims button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(255,209,102,.12) }

/* table of seats and cable cards */
.table { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.seat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: grid; gap: 8px; min-width: 0 }
.seat.cutter { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(255,209,102,.25) }
.seat.me { background: linear-gradient(180deg, rgba(90,182,255,.14), var(--panel)) }
.seat.off { opacity: .55 }
.seat .who { display: flex; justify-content: space-between; gap: 6px; align-items: center; min-width: 0 }
.seat .ava { width: 32px; height: 32px }
.seat .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.cables { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px }
.cc { padding: 0; border: 0; background: none; border-radius: 7px; aspect-ratio: 60 / 84; width: 100%; display: block; position: relative }
.cc svg { width: 100%; height: 100%; display: block }
.cc.can { animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(255,95,162,.8)) }
.cc.can:nth-child(2) { animation-delay: .15s } .cc.can:nth-child(3) { animation-delay: .3s } .cc.can:nth-child(4) { animation-delay: .45s }
@keyframes bob { 50% { transform: translateY(-4px) } }
.cc.pending { animation: pulse .6s infinite }
.cc.fresh { animation: flip .6s cubic-bezier(.2,.8,.3,1.2) }
@keyframes flip { from { transform: rotateY(180deg) scale(1.2) } to { transform: none } }
.mini { width: 30px; display: inline-block; vertical-align: middle }

/* manga burst on each cut */
#fx { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; z-index: 20 }
#fx .burst { opacity: 0; transform: scale(.4) rotate(-8deg) }
#fx.show .burst { animation: pop .95s ease-out forwards }
@keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-8deg) } 18% { opacity: 1; transform: scale(1.08) rotate(-4deg) } 70% { opacity: 1; transform: scale(1) rotate(-4deg) } 100% { opacity: 0; transform: scale(1.15) rotate(-4deg) } }
#fx .burst svg { width: min(78vw, 360px); height: auto }

.win { text-align: center; padding: 18px 14px; overflow: hidden; position: relative }
.win h2 { font-size: 2rem; text-shadow: 0 3px 0 rgba(0,0,0,.4) }
.win.sys h2 { color: var(--sys) } .win.rogue h2 { color: var(--core) }
.win svg.port { width: min(62%, 220px); height: auto; border-radius: 14px; margin: 6px auto; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.45) }

/* rules */
details.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px }
details.rules summary { cursor: pointer; font: 400 1.05rem var(--display) }
.rules .teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px }
.rules .teams div { display: grid; gap: 6px; text-align: center; font-size: .85rem; color: var(--muted) }
.rules .teams svg { width: 100%; height: auto; border-radius: 12px }
.rules .deck { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; text-align: center; font-size: .82rem; color: var(--muted) }
.rules .deck svg { width: 64px; height: auto; display: block; margin: 0 auto 4px }
.rules ol { margin: 14px 0 0; padding-left: 1.2em; display: grid; gap: 8px; color: var(--muted) }
.rules b { color: var(--fg) }
@media (prefers-reduced-motion: reduce) { .turn.mine, .cc.can, .cc.pending, .cc.fresh, body.shake { animation: none } #fx { display: none } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A2391"/><stop offset=".55" stop-color="#2A1663"/><stop offset="1" stop-color="#120B36"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".5" stop-color="#FFD166"/><stop offset="1" stop-color="#C98B2B"/></linearGradient>
  <linearGradient id="gKey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B8A6E"/><stop offset="1" stop-color="#0A2E3A"/></linearGradient>
  <linearGradient id="gDead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5672"/><stop offset="1" stop-color="#1E2433"/></linearGradient>
  <linearGradient id="gCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3133F"/><stop offset="1" stop-color="#2A0716"/></linearGradient>
  <radialGradient id="gGlowK"><stop offset="0" stop-color="#9BFFE0" stop-opacity=".9"/><stop offset="1" stop-color="#5CF2B0" stop-opacity="0"/></radialGradient>
  <radialGradient id="gGlowV"><stop offset="0" stop-color="#FF9AB5" stop-opacity=".95"/><stop offset="1" stop-color="#FF3D6E" stop-opacity="0"/></radialGradient>
  <radialGradient id="gOrb" cx=".38" cy=".35"><stop offset="0" stop-color="#FF7A9C"/><stop offset=".55" stop-color="#B3143F"/><stop offset="1" stop-color="#3A0515"/></radialGradient>
  <linearGradient id="gSys" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD3FF"/><stop offset=".5" stop-color="#3A62D9"/><stop offset="1" stop-color="#1B1460"/></linearGradient>
  <linearGradient id="gRogue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8AA8"/><stop offset=".45" stop-color="#9B1240"/><stop offset="1" stop-color="#22051A"/></linearGradient>
  <pattern id="pDots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#FFFFFF" opacity=".14"/></pattern>
</defs></svg>
<div class="wrap">
  <header class="row" style="justify-content:space-between;align-items:flex-end">
    <div class="logo"><h1>ROGUE <span>CORE</span></h1><small>ローグ・コア</small></div>
    <span class="label" id="conn">Offline</span>
  </header>
  <main id="app" style="display:grid;gap:16px"></main>
  <details class="rules" id="rules"><summary>How to play</summary><div id="rules-body"></div></details>
  <p class="muted" style="font-size:.8rem;text-align:center">Phones connect directly to each other. It works best when everyone is on the same Wi-Fi.</p>
</div>
<div id="fx" aria-hidden="true"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ---------- utilities ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const randId = (n, abc) => Array.from({ length: n }, () => abc[rnd(abc.length)]).join("");
const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ";
const NAMES = { K: "KEY", D: "DEAD", V: "CORE" };
const PREFIX = "roguecore-v1-";            // host's public id on the free PeerJS broker: PREFIX + game code

const me = { pid: LS.get("rc-pid") || randId(10, "abcdefghijkmnpqrstuvwxyz23456789"), name: LS.get("rc-name") || "" };
LS.set("rc-pid", me.pid);

// ---------- session ----------
let peer = null, conn = null, code = null, isHost = false, connState = "Offline";
let view = null;            // last state from the host: { st, lobby, claims, secret }
let H = null;               // host only: the full game, including every hand
const players = new Map();  // host only: pid -> { pid, name, conn, claim, lastN }
let pending = null, peekOpen = false, lastEventN = -1, freshCable = null, retryTimer = null, firstStateTimer = null, hint = "";
function setConn(s) { connState = s; const el = $("#conn"); if (el) el.textContent = s; }

// ---------- host engine ----------
const rogueCount = n => (n <= 4 ? 1 : n <= 7 ? 2 : 3);
const ROUND_SIZES = [4, 3, 2];
const online = p => p.bot || p.pid === me.pid || !!(p.conn && p.conn.open);

// ---------- computer players (run on the host's phone) ----------
const BOT_NAMES = ["Ada", "Turing", "Hopper", "Lovelace", "Shannon", "Babbage", "Knuth"];
let botTimer = null;
function addBot() {
  if ([...players.values()].filter(online).length >= 8) return;
  const used = new Set([...players.values()].map(p => p.name));
  const name = "Bot " + (BOT_NAMES.find(n => !used.has("Bot " + n)) || randId(3, CODE_ABC));
  const pid = "bot" + randId(7, "abcdefghijkmnpqrstuvwxyz23456789");
  players.set(pid, { pid, name, bot: true, conn: null, claim: null, lastN: 0 });
  broadcast();
}
function removeBot(pid) { const p = players.get(pid); if (p && p.bot) { players.delete(pid); broadcast(); } }
// Sysadmin bots claim the truth; Rogue bots bluff about half the time.
function botClaims() {
  for (const p of players.values()) {
    if (!p.bot || !H.hands[p.pid]) continue;
    const h = H.hands[p.pid], k = h.filter(c => c === "K").length, v = h.includes("V");
    const lie = H.roles[p.pid] === "R" && rnd(2) === 0;
    p.claim = { rd: H.round + 1, k: lie ? rnd(Math.min(3, h.length) + 1) : k, v: lie ? false : v };
  }
}
function scheduleBot() {
  if (!H || H.ph !== "play" || botTimer) return;
  const p = players.get(H.tp); if (!p || !p.bot) return;
  botTimer = setTimeout(() => {
    botTimer = null;
    if (!H || H.ph !== "play" || H.tp !== p.pid) return;
    // pick a hidden cable from someone else, leaning toward players who claim keys
    const options = [];
    for (const q of H.players) {
      if (q.pid === p.pid) continue;
      const c = players.get(q.pid) && players.get(q.pid).claim, weight = 1 + (c && c.rd === H.round + 1 ? c.k : 0);
      H.rev[q.pid].forEach((r, i) => { if (!r) for (let w = 0; w < weight; w++) options.push([q.pid, i]); });
    }
    if (options.length) { const [t, i] = options[rnd(options.length)]; cut(p.pid, t, i); }
  }, 1500);
}
function publicState() {
  if (!H) return { ph: "lobby" };
  return {
    ph: H.ph, rd: H.round + 1, cu: H.cuts, need: H.players.length, kf: H.kf, tp: H.tp, win: H.win, last: H.last,
    pl: H.players.map(p => [p.pid, p.name, H.rev[p.pid].map(c => c || ".").join("")]),
    ro: H.ph === "end" ? H.players.map(p => H.roles[p.pid]).join("") : null,
  };
}
function secretFor(pid) {
  if (!H || H.ph !== "play" || !H.hands[pid]) return null;
  const h = H.hands[pid];
  return { r: H.roles[pid], k: h.filter(c => c === "K").length, d: h.filter(c => c === "D").length, v: h.filter(c => c === "V").length, rd: H.round + 1 };
}
function broadcast() {
  const st = publicState();
  const lobby = [...players.values()].map(p => ({ pid: p.pid, name: p.name, host: p.pid === me.pid, bot: !!p.bot, on: online(p) }));
  const claims = {}; for (const p of players.values()) if (p.claim) claims[p.pid] = p.claim;
  for (const p of players.values()) {
    const msg = { type: "state", st, lobby, claims, secret: secretFor(p.pid) };   // each phone gets only its own secret
    if (p.pid === me.pid) { view = msg; }
    else if (p.conn && p.conn.open) { try { p.conn.send(msg); } catch {} }
  }
  LS.set("rc-host-" + code, { H, players: [...players.values()].map(p => ({ pid: p.pid, name: p.name, bot: !!p.bot, claim: p.claim, lastN: p.lastN })) });
  render();
  scheduleBot();
}
function startGame() {
  // 1 or 2 people can play: computer players fill the table up to the 3-player minimum.
  while ([...players.values()].filter(online).length < 3) addBot();
  const list = [...players.values()].filter(online).map(p => ({ pid: p.pid, name: p.name }));
  if (list.length < 3 || list.length > 8) return;
  const n = list.length, roles = shuffle([...Array(rogueCount(n)).fill("R"), ...Array(n - rogueCount(n)).fill("G")]);
  H = { players: list, roles: {}, hands: {}, rev: {}, round: 0, cuts: 0, kf: 0, win: null, last: null, ph: "play", tp: list[rnd(n)].pid, ev: 0 };
  list.forEach((p, i) => (H.roles[p.pid] = roles[i]));
  deal([...Array(n).fill("K"), "V", ...Array(n * 4 - n - 1).fill("D")], ROUND_SIZES[0]);
  broadcast();
}
function deal(cards, size) {
  shuffle(cards);
  H.players.forEach((p, j) => { H.hands[p.pid] = cards.slice(j * size, (j + 1) * size); H.rev[p.pid] = Array(size).fill(null); });
  for (const p of players.values()) p.claim = null;
  botClaims();
}
function cut(from, t, i) {
  if (!H || H.ph !== "play" || from !== H.tp || t === from) return;
  const rv = H.rev[t]; if (!rv || !Number.isInteger(i) || i < 0 || i >= rv.length || rv[i]) return;
  const c = H.hands[t][i]; rv[i] = c;
  H.cuts++; if (c === "K") H.kf++;
  H.ev++; H.last = { f: from, t, c, i, n: H.ev }; H.tp = t;
  const n = H.players.length;
  if (c === "V") { H.ph = "end"; H.win = "R"; }

    <li><b>Win.</b> Sysadmins win when all clean keys are found. Rogue AIs win the moment the core is cut, or when 3 rounds end first.</li>
  </ol>
  <p class="muted" style="margin-top:10px;font-size:.85rem">Playing alone or with 2? Computer players fill the empty seats.</p>`;
}
{ const rb = document.getElementById && document.getElementById("rules-body"); if (rb) rb.innerHTML = rulesHTML(); }

// ---------- rendering ----------
let toastMsg = "", toastTimer = null;
function toast(m) { toastMsg = m; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastMsg = ""; render(); }, 3500); render(); }
const nameOf = (st, pid) => { const r = (st.pl || []).find(p => p[0] === pid); return r ? r[1] : "Someone"; };
const isBotPid = pid => /^bot/.test(pid);
const pageLink = () => location.href.split("#")[0].split("?")[0];

function viewHome() {
  const cur = LS.get("rc-current");
  const linked = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1];
  return `
  <section class="card">
    <div class="row" style="flex-wrap:nowrap;gap:12px">${cardBack().replace("<svg", '<svg class="mini" style="width:46px"')}
      <p>A secret-team party game for 1–8 people, each on their own phone. Somewhere in the rack is a <b style="color:var(--core)">rogue core</b>. Find every clean key before someone cuts it.</p></div>
    ${typeof Peer === "undefined" ? `<p class="notice">The connection library didn't load. Check your internet and reload.</p>` : ""}
    <label class="label" for="name-in">Your name</label>
    <input id="name-in" maxlength="14" autocomplete="nickname" placeholder="e.g. Ameen" value="${esc(me.name)}">
    <button class="primary" id="create">Create a game</button>
    <div class="label">or join with a code</div>
    <div class="split"><input id="code-in" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" value="${esc(linked ? linked.toUpperCase() : "")}"><button id="join">Join</button></div>
    ${cur ? `<button id="rejoin">Rejoin game ${esc(cur.code)}</button>` : ""}
  </section>`;
}
function viewLobby() {
  const ps = view ? view.lobby : [], on = ps.filter(p => p.on).length, ok = on >= 1 && on <= 8;
  const startLabel = on < 3 ? `Start (adds ${3 - on} computer player${3 - on === 1 ? "" : "s"})` : `Start with ${on} players`;
  const link = pageLink() + "#" + code;
  return `
  <section class="card" style="text-align:center">
    <span class="label">Game code</span>
    <div class="bigcode">${esc(code)}</div>
    <p class="muted">Friends open this site and join with the code, or use the link:</p>
    <div class="share"><code id="link">${esc(link)}</code><button id="copy">Copy link</button></div>
  </section>
  ${hint ? `<p class="notice">${esc(hint)}</p>` : ""}
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>Players</h2><span class="chip">${on} / 8</span></div>
    <ul class="players">${ps.map(p => `<li class="${p.on ? "" : "off"}"><span class="who-line">${avatar(p.pid, p.bot)}<span>${esc(p.name)}</span></span><span class="row">${p.host ? '<span class="chip gold">host</span>' : ""}${p.bot ? '<span class="chip">computer</span>' : ""}${p.pid === me.pid ? '<span class="chip">you</span>' : ""}${p.on ? "" : '<span class="chip">away</span>'}${isHost && p.bot ? `<button class="chip" data-unbot="${esc(p.pid)}" aria-label="Remove ${esc(p.name)}">remove</button>` : ""}</span></li>`).join("") || '<li class="muted">Connecting to the game…</li>'}</ul>
    ${isHost && on < 8 ? `<button id="addbot">+ Add computer player</button>` : ""}
    ${isHost ? `<button class="primary" id="start" ${ok ? "" : "disabled"}>${ok ? startLabel : "Up to 8 players"}</button>
      <p class="muted" style="font-size:.85rem">Keep this page open: your phone runs the game for everyone.</p>`
    : `<p class="muted">${view ? "Waiting for the host to start…" : "Connecting to the host…"}</p>`}
    <button id="leave">Leave</button>
  </section>`;
}
function viewPlay(st) {
  const inGame = (st.pl || []).some(p => p[0] === me.pid), myTurn = st.ph === "play" && st.tp === me.pid;
  const roundSize = ROUND_SIZES[(st.rd || 1) - 1] || 2;
  const claims = {}; for (const [pid, c] of Object.entries(view.claims || {})) if (c && c.rd === st.rd) claims[pid] = c;
  const away = new Set((view.lobby || []).filter(p => !p.on).map(p => p.pid));
  const ev = st.last ? `<p class="event"><b>${esc(nameOf(st, st.last.f))}</b> cut <b>${esc(nameOf(st, st.last.t))}</b>'s cable: <span style="color:${st.last.c === "K" ? "var(--key)" : st.last.c === "V" ? "var(--core)" : "var(--muted)"}">${NAMES[st.last.c]}</span></p>` : "";
  let secretPanel;
  if (inGame) {
    const s = view.secret, team = s ? (s.r === "R" ? "rogue" : "sys") : "", my = claims[me.pid] || {};
    const handCards = s ? [...Array(s.k).fill("K"), ...(s.v ? ["V"] : []), ...Array(s.d).fill("D")] : [];
    secretPanel = `
    <section class="card">
      <div class="row" style="justify-content:space-between"><span class="label">Your secret card</span><span class="label">Round ${st.rd} of 3</span></div>
      <div class="peek ${peekOpen && s ? "open" : ""}" id="peek" role="button" tabindex="0" aria-label="Press and hold to see your team and cables">
        ${peekOpen && s ? `<div class="rolecard ${team}">${portrait(s.r)}<div><div class="rn">${s.r === "R" ? "Rogue AI" : "Sysadmin"}</div>
          <p class="muted" style="font-size:.85rem">${s.r === "R" ? "Get the core cut, or stall until time runs out." : "Find every clean key."}</p>
          <div class="label" style="margin-top:10px">Your cables this round</div>
          <div class="hand">${handCards.map(c => `<span class="mini">${cardFace(c)}</span>`).join("")}</div>
          <p style="font-size:.85rem;margin-top:4px">${s.k} key${s.k === 1 ? "" : "s"} · ${s.d} dead${s.v ? ' · <b style="color:var(--core)">the core!</b>' : ""}</p></div></div>`
        : `<div><b style="font-family:var(--display);font-weight:400;font-size:1.1rem">Press and hold to peek</b><p class="muted" style="font-size:.85rem">Cover your screen first.</p></div>`}
      </div>
      <div class="label">Post a claim (you can bluff)</div>
      <div class="claims">${Array.from({ length: roundSize + 1 }, (_, k) => `<button data-claim="${k}" aria-pressed="${my.k === k}">${k} key${k === 1 ? "" : "s"}</button>`).join("")}
        <button data-core="1" aria-pressed="${!!my.v}">I have the core</button></div>
    </section>`;
  } else secretPanel = `<p class="notice">This game started without you. You're watching.</p>`;
  const turn = myTurn ? `<div class="turn mine">✂ You hold the cutter! Tap someone else's cable.</div>`
    : `<div class="turn">${avatar(st.tp, isBotPid(st.tp))}<span><b>${esc(nameOf(st, st.tp))}</b> holds the cutter…</span></div>`;
  const seats = (st.pl || []).map(([pid, name, cards]) => {
    const cl = claims[pid];
    return `<div class="seat ${pid === st.tp ? "cutter" : ""} ${pid === me.pid ? "me" : ""} ${away.has(pid) ? "off" : ""}">
      <div class="who"><span class="who-line" style="gap:8px">${avatar(pid, isBotPid(pid))}<span class="nm">${esc(name)}${pid === me.pid ? " (you)" : ""}</span></span>${pid === st.tp ? '<span class="chip gold">✂</span>' : away.has(pid) ? '<span class="chip">away</span>' : ""}</div>
      ${cl ? `<div class="row" style="gap:4px"><span class="chip key">says ${cl.k} key${cl.k === 1 ? "" : "s"}</span>${cl.v ? '<span class="chip core">says core</span>' : ""}</div>` : ""}
      <div class="cables">${[...cards].map((c, i) => {
        if (c !== ".") return `<span class="cc ${freshCable === pid + ":" + i ? "fresh" : ""}">${cardFace(c)}</span>`;
        const can = myTurn && pid !== me.pid, pend = pending && pending.t === pid && pending.i === i;
        return `<button class="cc ${can ? "can" : ""} ${pend ? "pending" : ""}" data-t="${esc(pid)}" data-i="${i}" ${can ? "" : "disabled"} aria-label="${esc(name)}'s cable ${i + 1}, face down">${cardBack()}</button>`;
      }).join("")}</div>
    </div>`;
  }).join("");
  return `
  ${secretPanel}
  <section class="status">
    <div class="stat"><span class="label">Keys found</span><b>${st.kf} / ${st.need}</b><div class="keys">${Array.from({ length: st.need }, (_, k) => `<i class="${k < st.kf ? "on" : ""}"></i>`).join("")}</div></div>
    <div class="stat"><span class="label">Cuts this round</span><b>${st.cu} / ${st.need}</b></div>
    <div class="stat"><span class="label">Round</span><b>${st.rd} / 3</b></div>
  </section>
  ${turn}
  ${ev}
  <section class="table">${seats}</section>
  <button id="leave">Leave game</button>`;
}
function viewEnd(st) {
  const sys = st.win === "G";
  const why = sys ? "Every clean key was found." : st.last && st.last.c === "V" ? `${esc(nameOf(st, st.last.f))} cut the rogue core.` : "Time ran out after round 3.";
  return `
  <section class="card win ${sys ? "sys" : "rogue"}">
    <span class="label">Game over</span>
    ${portrait(sys ? "G" : "R", "port")}
    <h2>${sys ? "SYSADMINS WIN!" : "ROGUE AI WINS!"}</h2>
    <p class="muted">${why}</p>
  </section>
  <section class="card">
    <h2>Who was who</h2>
    <ul class="players">${(st.pl || []).map(([pid, name], k) => { const r = (st.ro || "")[k]; return `<li><span class="who-line">${avatar(pid, isBotPid(pid))}<span>${esc(name)}${pid === me.pid ? " (you)" : ""}</span></span><span class="chip ${r === "R" ? "core" : "key"}">${r === "R" ? "Rogue AI" : "Sysadmin"}</span></li>`; }).join("")}</ul>
    ${isHost ? `<button class="primary" id="again">Play again</button><button id="lobby">Back to lobby</button>` : `<p class="muted">The host can start the next game.</p>`}
    <button id="leave">Leave</button>
  </section>`;
}
function render() {
  const app = $("#app");
  const focusId = document.activeElement && document.activeElement.id;
  const keep = { name: $("#name-in") && $("#name-in").value, code: $("#code-in") && $("#code-in").value };
  let html;
  if (!code) html = viewHome();
  else {
    const st = view && view.st;
    if (!st || st.ph === "lobby") html = viewLobby();
    else {
      if (st.last && st.last.n !== lastEventN) {
        const first = lastEventN === -1; lastEventN = st.last.n; freshCable = st.last.t + ":" + st.last.i; pending = null;
        if (!first) playFx(st.last.c);
      }
      html = st.ph === "end" ? viewEnd(st) : viewPlay(st);
    }
  }
  if (toastMsg) html = `<p class="notice">${esc(toastMsg)}</p>` + html;
  app.innerHTML = html;
  if ($("#name-in") && keep.name != null) $("#name-in").value = keep.name;
  if ($("#code-in") && keep.code != null) $("#code-in").value = keep.code;
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}

// ---------- input ----------
function saveName() { const v = (($("#name-in") && $("#name-in").value) || me.name).trim(); if (!v) { toast("Type your name first."); return false; } me.name = v.slice(0, 14); LS.set("rc-name", me.name); return true; }
const peerReady = () => { if (typeof Peer === "undefined") { toast("The connection library didn't load. Reload the page."); return false; } return true; };
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.id === "create") { if (saveName() && peerReady()) hostOpen(randId(4, CODE_ABC), true); }
  else if (b.id === "join") { const c = ($("#code-in").value || "").trim().toUpperCase(); if (!/^[A-Z]{4}$/.test(c)) return toast("Game codes are 4 letters."); if (saveName() && peerReady()) clientOpen(c); }
  else if (b.id === "rejoin") { const cur = LS.get("rc-current"); if (cur && saveName() && peerReady()) cur.host ? hostOpen(cur.code, false) : clientOpen(cur.code); }
  else if (b.id === "start" || b.id === "again") startGame();
  else if (b.id === "addbot") addBot();
  else if (b.dataset.unbot) removeBot(b.dataset.unbot);
  else if (b.id === "lobby") backToLobby();
  else if (b.id === "leave") leaveGame();
  else if (b.id === "copy") {
    const t = $("#link").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Link copied."), () => { const r = document.createRange(); r.selectNodeContents($("#link")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  }
  else if (b.dataset.t) { pending = { t: b.dataset.t, i: +b.dataset.i }; send({ type: "act", n: Date.now(), t: b.dataset.t, i: +b.dataset.i }); render(); }
  else if (b.dataset.claim || b.dataset.core) {
    const st = view.st, cur = (view.claims || {})[me.pid]; const same = cur && cur.rd === st.rd;
    if (b.dataset.claim) send({ type: "claim", k: +b.dataset.claim, v: same ? !!cur.v : false });
    else send({ type: "claim", k: same ? cur.k : 0, v: !(same && cur.v) });
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "code-in") $("#join").click();
  if ((e.key === " " || e.key === "Enter") && e.target.id === "peek" && !peekOpen) { e.preventDefault(); peekOpen = true; render(); }
});
document.addEventListener("keyup", e => { if (e.target.id === "peek" && peekOpen) { peekOpen = false; render(); } });
document.addEventListener("pointerdown", e => { if (e.target.closest("#peek")) { peekOpen = true; render(); } });
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, () => { if (peekOpen) { peekOpen = false; render(); } });
document.addEventListener("contextmenu", e => { if (e.target.closest("#peek")) e.preventDefault(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden && peekOpen) { peekOpen = false; render(); }
  // phones drop connections while asleep: reconnect when the page comes back
  if (!document.hidden && code && peer) { if (peer.disconnected) { try { peer.reconnect(); } catch {} } if (!isHost && (!conn || !conn.open)) connectToHost(); }
});

render();
</script>
